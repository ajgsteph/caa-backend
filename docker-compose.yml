x-app-env: &app-env
  env_file:
    - .env

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: caa-backend:latest
    restart: unless-stopped
    <<: *app-env
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - app-storage:/var/www/storage/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: caa-backend:latest
    restart: unless-stopped
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "--tries=3",
        "--timeout=120",
        "--sleep=2",
      ]
    <<: *app-env
    volumes:
      - app-storage:/var/www/storage/app
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caa}
      POSTGRES_USER: ${POSTGRES_USER:-caa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caa}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-caa} -d ${POSTGRES_DB:-caa}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  app-storage:
  db-data:
  redis-data:
